name: Bug or performance report
description: Report a reproducible correctness, build or performance problem.
title: "[bug] "
body:
  - type: input
    id: version
    attributes:
      label: Version and source commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows build, filesystem and storage type
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected result
      description: Use a disposable example; include the exact mode and command.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic codes and report
      description: Redact private paths, user data and credentials. For suspected vulnerabilities, follow SECURITY.md.
