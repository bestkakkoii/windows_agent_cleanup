name: Bug or performance report
description: Report a reproducible correctness, build or performance problem.
title: "[bug] "
body:
  - type: input
    id: version
    attributes:
      label: Distribution version, application version and source reference
      description: Include the downloaded archive SHA-256, or the tested source commit for your own build; the v2.0.0 owner binaries still report 2.0.0-dev.1.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows build, filesystem and storage type
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected result
      description: Use a disposable example; include the exact mode and command.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic codes and report
      description: Redact private paths, user data and credentials. For suspected vulnerabilities, follow SECURITY.md.
