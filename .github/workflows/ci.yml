name: source_and_windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@ff73b2463e2f3baa703f830da214b8dfeeaeccf8
        with:
          python-version: '3.x'
      - name: Check maintained sources and module boundaries
        run: python scripts/validate.py --output-dir build/source_validation
      - name: Check archive integrity rejection cases
        run: python tests/package_tests.py
      - name: Check deterministic future runtime packaging with synthetic PE fixtures
        run: python tests/package_runtime_tests.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: source_contract_${{ github.sha }}
          path: build/source_validation/
          retention-days: 14
          if-no-files-found: error

  native_windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Identify runner image
        id: image
        shell: pwsh
        run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'
      - uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        id: tools
        with:
          path: |
            build/tools/
            build/dependencies/
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.version }}-tools-${{ hashFiles('dependencies.lock.json', 'scripts/build_windows.ps1') }}
          # A runner-image rollover need not rebuild an unchanged compiler/SDK
          # tuple. The bootstrap still verifies its exact identity and four
          # binary hashes before reuse; an incompatible restored entry rebuilds.
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned tools and Release modules; run isolated fixtures
        shell: powershell
        run: >-
          & ./scripts/build_windows.ps1 -enable_isolated_destructive_tests
      - name: Assemble and verify unpublished development test sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Get-Content build/windows_release/CMakeCache.txt
          $cmake = ($cache | Where-Object { $_.StartsWith('CMAKE_COMMAND:INTERNAL=') } | Select-Object -First 1).Split('=', 2)[1]
          $ctest = Join-Path (Split-Path -Parent $cmake) 'ctest.exe'
          python scripts/validate.py --output-dir build/final_validation --build-dir build/windows_release --skip-build --ctest $ctest
          if ($LASTEXITCODE -ne 0) { throw 'test_source.validation_failed' }
          $run = Get-ChildItem build_logs -Filter result.json -Recurse | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          $report = Get-Content -LiteralPath $run.FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'passed' -or $report.isolated_destructive_tests -ne 'passed') { throw 'test_source.native_gate_failed' }
          $report | Add-Member -NotePropertyName source_commit -NotePropertyValue $env:GITHUB_SHA
          $report | Add-Member -NotePropertyName ci_url -NotePropertyValue "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $report | Add-Member -NotePropertyName runner_os -NotePropertyValue ([Runtime.InteropServices.RuntimeInformation]::OSDescription)
          $report | Add-Member -NotePropertyName runner_image -NotePropertyValue $env:ImageVersion
          $evidence = Join-Path $env:RUNNER_TEMP 'source_evidence'
          $output = Join-Path $env:RUNNER_TEMP 'test_source'
          New-Item -ItemType Directory -Force $evidence, $output | Out-Null
          $native = Join-Path $evidence 'native_windows_result.json'
          [IO.File]::WriteAllText($native, ($report | ConvertTo-Json -Depth 12), [Text.UTF8Encoding]::new($false))
          $archive = Join-Path $output "windows_agent_cleanup_test_source_2.0.0_dev1_$($env:GITHUB_SHA.Substring(0, 12)).zip"
          python scripts/package.py --output $archive --validation build/final_validation/validation_report.json --offline-dependencies --evidence $native --evidence (Join-Path $run.DirectoryName 'safe_tests.xml') --evidence (Join-Path $run.DirectoryName 'isolated_destructive_tests.xml')
          if ($LASTEXITCODE -ne 0) { throw 'test_source.package_failed' }
          python scripts/verify_package.py $archive --expected-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'test_source.archive_verification_failed' }
      - name: Assemble and inspect unpublished runtime test bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = (Resolve-Path build/windows_release/secure_erase_cli.exe).Path
          $gui = (Resolve-Path build/windows_release/secure_erase_gui.exe).Path
          $capture = & $cli capabilities --contract-version 2
          if ($LASTEXITCODE -ne 0) { throw 'test_runtime.capabilities_failed' }
          $cliHash = (Get-FileHash -LiteralPath $cli -Algorithm SHA256).Hash.ToLowerInvariant()
          $guiHash = (Get-FileHash -LiteralPath $gui -Algorithm SHA256).Hash.ToLowerInvariant()
          $provenance = @{
            schema = 'windows_agent_cleanup.runtime_inputs.v1'
            distribution_version = '2.0.0-dev.1'
            approved_binary_sha256 = @{'bin/secure_erase_cli.exe' = $cliHash; 'bin/secure_erase_gui.exe' = $guiHash}
            capabilities_capture = @{cli_sha256 = $cliHash; result = ($capture | ConvertFrom-Json)}
          }
          $output = Join-Path $env:RUNNER_TEMP 'test_runtime'
          New-Item -ItemType Directory -Force $output | Out-Null
          $inputs = Join-Path $env:RUNNER_TEMP 'runtime_inputs.json'
          [IO.File]::WriteAllText($inputs, ($provenance | ConvertTo-Json -Depth 24), [Text.UTF8Encoding]::new($false))
          $archive = Join-Path $output "windows_agent_cleanup_test_runtime_$($env:GITHUB_SHA.Substring(0, 12)).zip"
          python scripts/package_runtime.py --output $archive --cli $cli --gui $gui --provenance $inputs
          if ($LASTEXITCODE -ne 0) { throw 'test_runtime.package_failed' }
          python scripts/package_runtime.py --verify $archive
          if ($LASTEXITCODE -ne 0) { throw 'test_runtime.archive_verification_failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test_runtime_${{ github.sha }}
          path: ${{ runner.temp }}/test_runtime/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test_source_${{ github.sha }}
          path: ${{ runner.temp }}/test_source/
          retention-days: 30
          if-no-files-found: error
      - name: Check completed tool bootstrap
        id: receipt
        if: always()
        shell: pwsh
        run: |
          $receipts = @(Get-ChildItem build/tools -Filter toolchain.json -Recurse -ErrorAction SilentlyContinue)
          "ready=$($receipts.Count -gt 0)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        if: always() && steps.tools.outputs.cache-hit != 'true' && steps.receipt.outputs.ready == 'True'
        with:
          path: |
            build/tools/
            build/dependencies/
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native_windows_evidence_${{ github.sha }}
          path: |
            build_logs/
            build/final_validation/
            build/windows_release/Testing/Temporary/
          retention-days: 14
          if-no-files-found: error
