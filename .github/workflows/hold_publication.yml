name: hold_publication

on:
  push:
    branches: [main]
    paths: [.github/workflows/hold_publication.yml]
  workflow_dispatch:

permissions: {}

jobs:
  withdraw_unaccepted_candidate:
    if: github.repository == 'bestkakkoii/windows_agent_cleanup' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Withdraw the historical unaccepted candidate without changing its tag or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          endpoint = 'repos/bestkakkoii/windows_agent_cleanup/releases/413887239'
          def fetch():
              return json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          before = fetch()
          if (before['tag_name'] != 'source-rc-1b5bb2d6e6a6' or
                  before['target_commitish'] != '1b5bb2d6e6a6566ab28c52bbe7523d6c1acccaac' or
                  not before['prerelease']):
              raise SystemExit('withdrawal.historical_identity_mismatch')
          if not before['draft']:
              subprocess.run(['gh', 'api', '--method', 'PATCH', endpoint,
                              '-F', 'draft=true', '-f', 'make_latest=false'], check=True,
                             stdout=subprocess.DEVNULL)
          after = fetch()
          assets = lambda record: sorted((a['id'], a['name'], a['size']) for a in record['assets'])
          if not after['draft'] or after['tag_name'] != before['tag_name'] or assets(after) != assets(before):
              raise SystemExit('withdrawal.postcondition_failed')
          print(json.dumps({'event': 'publication.held', 'release_id': after['id'],
                            'draft': after['draft'], 'tag_and_assets_preserved': True}))
          PY
